name: Provision and Bootstrap Cluster

on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region / Terraform workspace to target"
        required: true
        default: "us-east-1"

concurrency:
  group: cluster-${{ github.event.inputs.region }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/tf
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Select workspace
        run: terraform workspace select -or-create "${{ github.event.inputs.region }}"

      - name: Terraform apply
        run: |
          terraform apply -auto-approve -input=false \
            -var-file="tfvars/${{ github.event.inputs.region }}.tfvars"

  bootstrap:
    needs: provision
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/tf
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Select workspace
        run: terraform workspace select "${{ github.event.inputs.region }}"

      - name: Get control plane IP
        id: cp
        run: echo "ip=$(terraform output -raw control_plane_public_ip)" >> "$GITHUB_OUTPUT"

      - name: Validate bootstrap secrets
        env:
          K8S_SSH_KEY: ${{ secrets.K8S_SSH_KEY }}
          ARGOCD_REPO_PAT: ${{ secrets.ARGOCD_REPO_PAT }}
        run: |
          set -e
          missing=""
          [ -z "$K8S_SSH_KEY" ] && missing="$missing K8S_SSH_KEY"
          [ -z "$ARGOCD_REPO_PAT" ] && missing="$missing ARGOCD_REPO_PAT"
          if [ -n "$missing" ]; then
            echo "Missing required secret(s):$missing"
            exit 1
          fi

      - name: Wait for control plane to finish initializing
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            for i in $(seq 1 60); do
              if [ -f /home/ubuntu/.kube/config ]; then
                echo "Control plane is ready"
                exit 0
              fi
              echo "Waiting for kubeadm init to finish... ($i/60)"
              sleep 10
            done
            echo "Timed out waiting for control plane to initialize"
            exit 1

      - name: Install Calico (idempotent)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          script: |
            set -e
            kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml

      - name: Install ArgoCD (idempotent)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          script: |
            set -e
            kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml --server-side --force-conflicts

      - name: Install Helm (idempotent)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          script: |
            set -e
            if ! command -v helm >/dev/null 2>&1; then
              curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
              chmod 700 get_helm.sh
              ./get_helm.sh
              rm -f get_helm.sh
            fi

      - name: Install EBS CSI driver (idempotent)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            helm repo add aws-ebs-csi-driver https://kubernetes-sigs.github.io/aws-ebs-csi-driver
            helm repo update
            helm upgrade --install aws-ebs-csi-driver aws-ebs-csi-driver/aws-ebs-csi-driver \
              -n kube-system

      - name: Deploy base manifests (idempotent)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          source: "infra/k8s/base/"
          target: "/home/ubuntu/k8s-base"
          strip_components: 3

      - name: Apply base manifests (namespaces, ebs-sc StorageClass)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          script: |
            set -e
            kubectl apply -f /home/ubuntu/k8s-base/

      - name: Deploy kube-prometheus-stack values (idempotent)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          source: "infra/k8s/monitoring/values.yaml"
          target: "/home/ubuntu/monitoring"
          strip_components: 3

      - name: Install kube-prometheus-stack (idempotent)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
            helm repo update
            helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
              -n monitoring --create-namespace \
              -f /home/ubuntu/monitoring/values.yaml

      - name: Deploy ingress-nginx values (idempotent)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          source: "infra/k8s/ingress-nginx/values.yaml"
          target: "/home/ubuntu/ingress-nginx"
          strip_components: 3

      - name: Install ingress-nginx (idempotent)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          script: |
            set -e
            helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
            helm repo update
            helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
              -n ingress-nginx --create-namespace \
              -f /home/ubuntu/ingress-nginx/values.yaml

      - name: Deploy cluster-autoscaler values (idempotent)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          source: "infra/k8s/cluster-autoscaler/values.yaml"
          target: "/home/ubuntu/cluster-autoscaler"
          strip_components: 3

      - name: Install cluster-autoscaler (idempotent)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          script: |
            set -e
            helm repo add autoscaler https://kubernetes.github.io/autoscaler
            helm repo update
            helm upgrade --install cluster-autoscaler autoscaler/cluster-autoscaler \
              -n kube-system --version 9.37.0 \
              -f /home/ubuntu/cluster-autoscaler/values.yaml

      - name: Configure ArgoCD repo credentials (idempotent)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          envs: ARGOCD_REPO_PAT
          script: |
            set -e
            kubectl create secret generic polyai-repo -n argocd \
              --from-literal=type=git \
              --from-literal=url=https://github.com/rinaahmd/PolyAIFursa-Private.git \
              --from-literal=username=rinaahmd \
              --from-literal=password="$ARGOCD_REPO_PAT" \
              --dry-run=client -o yaml \
              | kubectl label --local -f - argocd.argoproj.io/secret-type=repository -o yaml \
              | kubectl apply -f -

      - name: Deploy ArgoCD Applications (idempotent)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          source: "infra/argocd/applications/"
          target: "/home/ubuntu/argocd-applications"
          strip_components: 3

      - name: Apply ArgoCD Applications
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.cp.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.K8S_SSH_KEY }}
          script: |
            set -e
            kubectl apply -f /home/ubuntu/argocd-applications/
