global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "yolo"
    static_configs:
      - targets:
          - "yolo:8080"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"

  - job_name: "agent"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "agent:8000"