prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ebs-sc
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 3Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  persistence:
    enabled: true
    storageClassName: ebs-sc
    size: 1Gi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: sns-default
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      routes:
        # The control plane is intentionally stopped twice a day (account
        # budget-keeper Lambda), which trips the chart's built-in
        # component-health rules every time - these aren't real incidents,
        # so route them to a null receiver instead of emailing. The two
        # custom app alerts (AgentHighErrorRate, YoloHighRequestLatency)
        # are untouched and still fall through to sns-default below.
        - receiver: "null"
          matchers:
            - alertname =~ "KubeSchedulerInstanceUnreachable|KubeControllerManagerInstanceUnreachable|KubeProxyInstanceUnreachable|etcdMembersDown|etcdInsufficientMembers|TargetDown|Watchdog|KubeAPIDown|KubeletDown|InfoInhibitor"
    receivers:
      - name: sns-default
        sns_configs:
          - topic_arn: "arn:aws:sns:us-east-1:228281126655:rina-polyai-k8s-alerts"
            sigv4:
              region: us-east-1
            subject: "PolyAI Alert"
            send_resolved: true
      - name: "null"
