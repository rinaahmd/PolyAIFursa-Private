prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ebs-sc
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 3Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  persistence:
    enabled: true
    storageClassName: ebs-sc
    size: 1Gi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      # Default receiver is null - this is a tiny single-node cluster, so
      # the chart's default infra/resource-headroom rules (CPU overcommit,
      # component-unreachable, etcd redundancy, etc.) trip constantly and
      # aren't real incidents here. Only the two custom app alerts this
      # assignment is built around get explicitly routed to email; every
      # other alert (present or future) falls through to null by default,
      # so no more allowlist edits every time a new default rule fires.
      receiver: "null"
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      routes:
        - receiver: sns-default
          matchers:
            - alertname =~ "AgentHighErrorRate|YoloHighRequestLatency"
    receivers:
      - name: sns-default
        sns_configs:
          - topic_arn: "arn:aws:sns:us-east-1:228281126655:rina-polyai-k8s-alerts"
            sigv4:
              region: us-east-1
            subject: "PolyAI Alert"
            send_resolved: true
      - name: "null"
