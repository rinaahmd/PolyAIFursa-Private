apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: prod
  labels:
    app: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          # agent-service:0.1.0 was never built/pushed (manifest unknown) -
          # agent images are only ever tagged with the git commit SHA
          # (see .github/workflows/deploy.yaml), so this pins to the SHA
          # that's already built and confirmed running via Compose.
          # Add the prod NodePort origin to CORS allow_origins in
          # services/agent/app.py (see infra/README.md) once a public prod
          # host/DNS exists, then rebuild and update this tag.
          image: docker.io/rinaahmd/agent-service:5215304673881d12dd31d85e26230f3cd1c05fe2
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: YOLO_SERVICE_URL
              value: http://yolo:8080
            - name: IMG_PROC_MCP_URL
              value: http://img-proc-mcp:9000/mcp
            - name: MODEL
              value: amazon.nova-micro-v1:0
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_S3_BUCKET
              value: rina-polyai-images
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: prod
  labels:
    app: agent
spec:
  selector:
    app: agent
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30801
  # NodePort so the browser can reach the agent directly at
  # http://<PROD_PUBLIC_HOST>:30801 (point prod DNS, once it exists, at the
  # node's public IP). Switch to Ingress if a controller is added later.
  # Uses a different nodePort (30801) than dev (30800) since dev and prod
  # share one cluster's node port range.
  type: NodePort
