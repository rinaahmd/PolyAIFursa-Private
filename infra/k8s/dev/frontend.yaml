apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dev
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # dev-0.1.0 was never built/pushed to DockerHub (manifest unknown),
          # so this pinned to 0.0.2, the last image that actually exists and
          # runs, until dev-0.1.0 is built with:
          #   --build-arg NEXT_PUBLIC_AGENT_URL=http://rina-dev.fursa.click:30800
          # NEXT_PUBLIC_* values are inlined into the JS bundle at `npm run build`
          # time, so this image tag must be rebuilt whenever the dev agent's
          # public URL changes. See infra/README.md for the build command.
          image: docker.io/rinaahmd/frontend-service:0.0.2
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dev
spec:
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30300
  # NodePort so the browser can reach the frontend at
  # http://rina-dev.fursa.click:30300 (point that DNS record at the
  # node's public IP). Switch to Ingress if a controller is added later.
  type: NodePort
