apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rinaahmd/PolyAIFursa-Private.git
    targetRevision: main
    path: infra/k8s/prod
    directory:
      include: "frontend.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
