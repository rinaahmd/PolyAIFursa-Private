apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rinaahmd/PolyAIFursa-Private.git
    targetRevision: dev
    path: infra/k8s/dev
    directory:
      include: "frontend.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
